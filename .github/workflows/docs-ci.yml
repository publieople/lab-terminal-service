# 文档 CI —— 五道内容门 + 一道构建门，任何一道不过就阻断合并
#
# 门 1 markdownlint-cli2   中文排版（MD003/MD009/MD047 这些最常见的退回原因都在这）
# 门 2 check-pages         front-matter 字段与枚举 + 按 type 检查正文必填章节 + 索引与导航是否与目录树一致
# 门 3 gitleaks + check-secrets  凭据、内网 IP、tailnet 域名等敏感信息
# 门 4 lychee              链接检查
# 门 5 mkdocs --strict     真正构建一遍：警告即失败，等同于本地的 .\.venv\Scripts\mkdocs build --strict
# 门 6 check-stc           STC 的两条表达规则（代词主语、口号代替事实），按基线只拦新增
#                          见 scripts/check-stc.mjs 顶部注释：为什么只挑这两条
#
# 本地先把这几道门跑一遍再提 PR，见 CONTRIBUTING.md §2 和 .github/PULL_REQUEST_TEMPLATE.md。

name: 文档 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: 门 1 · 中文排版（markdownlint-cli2）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 配置直接读仓库根的 .markdownlint-cli2.jsonc——里面已经写好了 globs 和 ignores，
      # 所以这里不再另外传 globs，避免"CI 扫的集合"和"本地扫的集合"不一致。
      #
      # 版本钉到具体 tag，不要写 @v24：这个 action 把 markdownlint-cli2 打进自己的依赖，
      # 换一个 release 就等于换一套规则。v17 带的是 cli2 0.14.0（没有 MD060），
      # 而贡献者在本机 `npx markdownlint-cli2` 拿到的是 0.23.x（有 MD060）——
      # 于是同一个文件"本地红、CI 绿"，两边检查的根本不是同一件事。
      # v24.2.0 带 cli2 0.23.2，与本地 0.23.x 同一套规则。
      # 以后升级这里，必须同时在本机跑一次 `npx markdownlint-cli2` 确认两边都绿。
      - name: 跑 markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: .markdownlint-cli2.jsonc

  pages:
    name: 门 2 · front-matter、必填章节与生成物一致性（check-pages.mjs）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 试运行期间（_schema/pages.json 的 migrating: true）缺「难度 / 适用版本」
      # 只进待补清单、老页面缺新章节只进待重写清单，都不阻断；迁移完成后把
      # migrating 改成 false，这些就从提醒变成硬门。
      - name: 校验 front-matter、枚举与正文必填章节
        run: node scripts/check-pages.mjs

      # 索引表与三份导航都是生成的：CI 重跑一遍生成器并比对，
      # 手写的索引行、漏加的页面在这里被打回，而不是等站点上少一个链接才发现。
      - name: 索引表是否与 front-matter 一致
        run: node scripts/gen-index.mjs --check

      - name: 三份导航是否与目录树一致
        run: node scripts/gen-nav.mjs --check

  secrets:
    name: 门 3 · 敏感信息（gitleaks + check-secrets.mjs）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— gitleaks 要看历史提交，浅克隆会漏掉早先提交里混进来的凭据。
      - name: 检出仓库（含全部历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # gitleaks-action 在 PR 场景下必须拿到 GITHUB_TOKEN，否则直接失败。
      - name: gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 这一层是为了让贡献者在本地也能跑同一套规则（gitleaks 装在本地比较麻烦）。
      # 它只是正则兜底，扫不出"实验室 433 房间的那台服务器"这类信息，人工 Review 仍不能省。
      - name: 兜底正则扫描（内网地址与凭据）
        run: node scripts/check-secrets.mjs

  links:
    name: 门 4 · 链接检查（lychee）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 关于 --exclude 'publieople\.github\.io'：
      #   站点上线前，指向自己站点的绝对地址一定是打不开的，属"上线前必失败项"，
      #   所以当时只放过这一个域名。没有改用全站 --accept 4xx：那会把外链的 404
      #   一起放过，等于把链接检查这道门废掉。
      #   站点现已上线（https://publieople.github.io/lab-terminal-service/），
      #   这条排除已删除：README 里指向本仓库站点的绝对地址现在也必须真的能打开。
      # --accept 200,206,429,503：
      #   429（被限流）和 503（服务端暂时不可用）都不该当成断链。GitHub 对 runner
      #   抓 blob 页面会间歇回 503：2026-10-10 那条 qianguyihao/Web 的链接连跑三次
      #   CI 都是 503，同一时刻在浏览器里打开是 200。404 / 410 没有放进 --accept，
      #   真正失效的链接仍然会让这道门变红。
      # --exclude '^https?://(www\.)?(stackoverflow\.com|reddit\.com)'：
      #   这两家对非浏览器客户端一律回 403（反爬），人用浏览器打开是正常的，不算断链。
      #   **不要**图省事把 403 加进 --accept —— 那会连"真的 403（无权限 / 已下线）"一起放过。
      #   再加别的这类域名时，请在这里再补一条 --exclude 并写清是哪一家、为什么。
      - name: 跑 lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429,503
            --exclude '^https?://(www\.)?(stackoverflow\.com|reddit\.com)'
            --exclude-path site
            --exclude-path .venv
            'docs/**/*.md'
            '*.md'
          fail: true

  stc:
    name: 门 6 · 表达（STC 两条规则，按基线拦新增）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 检查器是 vendored 的（skills/stc/tools/cli.mjs），只用 Node 内置模块，不需要 npm install。
      # 只拦 D1（读者不知道主语是谁）与 G7（口号代替了事实）两条：其余规则对这个语料误报太多，
      # 全量接进来只会天天红。存量 245 处按文件记在 .stc-baseline.json，只挡新增；
      # 清理过的页面记得跑 `node scripts/check-stc.mjs --update` 把基线压下去。
      - name: STC 表达门
        run: node scripts/check-stc.mjs

  build:
    name: 门 5 · 构建（mkdocs build --strict）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          # setup-python 默认找 requirements.txt / pyproject.toml，找不到就直接失败。
          # 本仓库的依赖文件叫 requirements-docs.txt，必须显式指出来。
          cache-dependency-path: requirements-docs.txt

      - name: 安装文档依赖
        run: pip install -r requirements-docs.txt

      # --strict：把 mkdocs 的警告（断链、nav 指向不存在的页面、未列入 nav 的页面）当错误。
      # 本地用 .\.venv\Scripts\mkdocs build --strict，效果一致。
      - name: 严格模式构建
        run: mkdocs build --strict
