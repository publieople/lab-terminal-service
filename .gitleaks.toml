# gitleaks 配置：通用密钥规则 + 本实验室特有的"内网信息"规则
#
# 目标：让任何一条内网地址、tailnet 域名、token 都进不了公开仓库。
# 用法：gitleaks detect --config .gitleaks.toml --no-git
#      gitleaks protect --config .gitleaks.toml --staged

title = "终端服务部知识库"

[extend]
# 继承 gitleaks 默认规则集
useDefault = true

[[rules]]
id = "tailnet-domain"
description = "Tailscale tailnet 域名（*.ts.net）属于内网信息"
regex = '''[a-z0-9-]+\.ts\.net'''
tags = ["internal", "network"]

[[rules]]
id = "private-ipv4"
description = "RFC1918 内网 IPv4 地址"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["internal", "network"]
# 文档里举例用的文档专用网段不算（RFC5737），这里不做排除，因为它本来就不匹配 RFC1918

[[rules]]
id = "ipv4-with-port"
description = "公网 IPv4 带端口，疑似真实服务器地址"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d):\d{2,5}\b'''
tags = ["internal"]

[[rules]]
id = "jwt"
description = "JWT（三段式 base64url）"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["secret"]

[[rules]]
id = "openai-style-key"
description = "OpenAI / 兼容格式的 API key"
regex = '''\bsk-[A-Za-z0-9]{20,}\b'''
tags = ["secret"]

[[rules]]
id = "bearer-token"
description = "Bearer token 字面量"
regex = '''(?i)bearer\s+[A-Za-z0-9._\-]{20,}'''
tags = ["secret"]

[[rules]]
id = "password-assignment"
description = "口令赋值形态"
regex = '''(?i)(password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*["']?[^\s"']{8,}'''
tags = ["secret"]

[allowlist]
description = "允许出现在公开文档里的形态"
regexes = [
  # 文档示例专用网段（RFC5737），故意保留以免举例时踩雷
  '''\b(?:192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}\b''',
  # 占位符
  '''<(?:内网IP|服务器|主机名|token|password|域名|设备名)>''',
  # 本仓库自己的公开地址
  '''publieople\.github\.io''',
  '''github\.com/publieople''',
  # 公开的示例/文档域名
  '''example\.(?:com|org|net)''',
  # 常见公开上游地址
  '''raw\.githubusercontent\.com''',
  '''creativecommons\.org''',
  '''127\.0\.0\.1''',
  '''0\.0\.0\.0''',
]
paths = [
  '''\.gitleaks\.toml$''',
]
